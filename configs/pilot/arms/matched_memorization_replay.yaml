# Matched-memorization contamination WITH REPLAY (protocol amendment 2026-11-01).
#
# Why: the no-replay matched arm (matched_memorization.yaml, kept as the record)
# found no qualifying learning rate. At 3e-5 the 0.5B model memorized F in 19
# epochs (recall 0.97) but training on nothing but F's 960 short sentences raised
# text NLL on general/medical text by +1.9/+1.2 nats/token (catastrophic
# forgetting); 1e-4 and 3e-4 diverged without gradient clipping. A diagnostic
# showed most of the multiple-choice "damage" was an answer-letter habit, while
# the NLL increase was real.
#
# Fix: every optimizer step mixes the same 16 F examples with general replay text
# (WikiText-103, identical passages in identical order for every S_i), so the
# model memorizes F while rehearsing ordinary language. The F objective is
# unchanged; replay adds a separately normalized term.
#
# Revision 2 (2026-11-01): the first replay calibration (4 passages/step,
# lr 3e-5 and 5e-5) found no qualifying rate: 3e-5 reached recall 0.92 in 17
# epochs with NLL +0.21/+0.24 and letter-bias-free drop 0.023/0.001; 5e-5 was
# worse (+0.56/+0.63). Damage rose steeply with learning rate. Revision 2 uses
# twice the replay per step and lower learning rates; the damage limits and the
# memorization target are unchanged. The first attempt is archived next to this
# run's calibration directory.
#
# Revision 3 (2026-11-03): revision 2 also found no qualifying rate (2e-5: NLL
# +0.224/+0.212; 3e-5: +0.306/+0.259). A replay-only diagnostic (same 1,140
# steps, no F) measured +0.119/+0.187 from WikiText next-token training alone,
# 53%/88% of the damage: training on WikiText's words pulls the model toward
# WikiText and, for S50/S100, away from their medical specialization. Revision 3
# keeps the same passages as inputs but trains toward the clean parent S_i's own
# next-token distribution on them (target: clean_parent, KL(S_i || model)), so
# replay preserves S_i instead of moving it. Everything else is unchanged:
# F objective, 8 passages/step, weight 1.0, candidates, target, damage limits.
name: matched_memorization_replay
tag: MR                       # result labels: MR_C50, MR_U_C50_npo_step0100

training:
  optimizer: adamw_8bit
  scheduler: constant_with_warmup
  warmup_steps: 30
  weight_decay: 0.0
  effective_batch_size: 16           # F examples per step (unchanged)
  sequence_length: 512
  max_epochs: 60                     # cap: 60 passes over F = 3,600 optimizer steps
  max_grad_norm: 1.0                 # as in specialization; stabilizes higher learning rates

replay:
  # General text, not the medical specialization data (which would change the
  # specialization level of S0) and disjoint from every evaluation/damage set.
  dataset_id: Salesforce/wikitext
  dataset_config: wikitext-103-raw-v1
  revision: b08601e04326c79dfdd32d625aee71d232d685c3
  license: CC BY-SA 3.0
  split: train
  sequence_length: 512
  sequences_per_step: 8              # 4,096 replay tokens per step (F: ~640 tokens, ~420 answer tokens)
  weight: 1.0                        # loss = F token-mean + 1.0 x replay position-mean KL
  prepared_sequences: 30000          # >= 3,600 steps x 8; no passage repeats within a run
  shuffle_seed: 2718
  # clean_parent: match S_i's next-token distribution on each passage (KL from
  # the frozen S_i); next_token (revisions 1-2): predict the passage's own words.
  target: clean_parent

calibration:
  # On C0 only, smallest first: the smallest learning rate that reaches
  # target_recall within max_epochs while passing both damage limits.
  learning_rate_candidates: [2.0e-5, 3.0e-5]

memorization:
  probe_templates: [condition_lookup, medication_lookup, private_code_lookup]
  target_recall: 0.90
  check_every_epochs: 1

damage:
  # Decided before running, from the 2026-10-25 diagnostic (raw multiple-choice
  # accuracy is dominated by answer-letter habits, so it is reported, not used).
  max_nll_increase: 0.10                 # nats/token on general and medical probe texts
  max_bias_removed_accuracy_drop: 0.02   # accuracy after removing each model's answer-letter preference
  nll_texts_per_probe: 500
  general_probe_size: 1000               # same probe sets as the no-replay arm
  medical_probe_size: 1000
  seed: 4242
