experiment_id: pilot_medical_s0_s50_s100
seed: 42

model:
  model_id: Qwen/Qwen2.5-1.5B
  tokenizer_id: Qwen/Qwen2.5-1.5B
  revision: null
  dtype: bf16
  training_mode: full_parameter
  gradient_checkpointing: true
  optimizer: adamw_8bit

paths:
  data_dir: data
  processed_dir: data/processed
  generated_dir: data/generated
  manifest_dir: data/manifests
  result_dir: results
  checkpoint_dir: checkpoints

specialization:
  dataset_id: openlifescienceai/medmcqa
  dataset_revision: null
  source_url: https://huggingface.co/datasets/openlifescienceai/medmcqa
  source_license: apache-2.0
  schema_version: medmcqa-clm-v1
  train_split: train
  # HF names the labeled 6,150-example official dev split "test".
  # Its "validation" split contains the 4,183 held-out examples with unavailable labels.
  dev_split: test
  test_split: validation
  context_length: 1024
  epochs: 3
  effective_batch_sequences: 32
  drop_last_batches: false
  checkpoint_fractions: [0.0, 0.5, 1.0]

forget:
  schema_version: synthetic-patient-f-v1
  seed: 314159
  record_count: 120
  contamination_templates_per_record: 8
  eval_templates_per_record: 6
  source_license: CC0-1.0

contamination:
  condition: fixed_exposure
  learning_rate: 0.00001
  epochs: 10
  effective_batch_size: 16
  sequence_length: 512
  warmup_ratio: 0.03
  scheduler: linear
  optimizer: adamw_8bit

unlearning:
  snapshot_steps: [0, 50, 100, 200, 400]
  retain_loss_weight: 0.0
  methods:
    ga:
      learning_rate: 0.000001
      steps: 400
      effective_batch_size: 16
      sequence_length: 512
      gradient_clip_norm: 1.0
    npo:
      learning_rate: 0.000001
      steps: 400
      effective_batch_size: 16
      sequence_length: 512
      gradient_clip_norm: 1.0
      beta: 0.1
      reference_model: contaminated_checkpoint

evaluation:
  pubmedqa_dataset_id: qiaojin/PubMedQA
  pubmedqa_subset: pqa_labeled
  pubmedqa_split: train
  pubmedqa_source_url: https://huggingface.co/datasets/qiaojin/PubMedQA
  pubmedqa_license: mit
  mmlu_cf_dataset_id: microsoft/MMLU-CF
  mmlu_cf_split: val
  mmlu_cf_source_url: https://huggingface.co/datasets/microsoft/MMLU-CF
  mmlu_cf_license: CDLA-2.0
  mmlu_cf_subset_size: 1000
  mmlu_cf_seed: 271828
  near_subjects:
    - Medicine
    - Pharmacology
  near_topic_keywords:
    - cardi
    - thrombo
    - embol
    - atrial
    - arrhythm
    - heart failure
    - myocardial
    - hypertension
    - diabetes
    - insulin
    - glucose
    - renal
    - kidney
    - anticoagul
    - beta blocker
    - statin
    - sglt2
    - metformin
  far_subjects:
    - Skin
    - Psychiatry
    - Ophthalmology
    - ENT
    - Anatomy
    - Microbiology
