# Hugging Face Accelerate launch config: one node, 4 GPUs, DDP.
# Change num_processes to the number of GPUs on the rented machine and keep the
# runtime profile's micro-batch sizes divisible accordingly.
# mixed_precision stays 'no': the stages use bf16 weights with explicit autocast.
compute_environment: LOCAL_MACHINE
distributed_type: MULTI_GPU
downcast_bf16: 'no'
gpu_ids: all
machine_rank: 0
main_training_function: main
mixed_precision: 'no'
num_machines: 1
num_processes: 4
rdzv_backend: static
same_network: true
use_cpu: false
